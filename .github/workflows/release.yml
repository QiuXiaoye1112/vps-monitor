name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build linux-amd64
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" go build -o vps-monitor-linux-amd64 -ldflags="-s -w" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: vps-monitor-linux-amd64
          generate_release_notes: true
