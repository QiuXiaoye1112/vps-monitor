<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Monitor Admin</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #0b1120;
        --card: #131b2e;
        --border: #1e2a45;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --red: #ef4444;
        --green: #22c55e;
        --yellow: #eab308;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
      }
      .sidebar {
        width: 210px;
        min-height: 100vh;
        background: var(--card);
        border-right: 1px solid var(--border);
        padding: 20px 0;
        flex-shrink: 0;
        position: sticky;
        top: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .sidebar h2 {
        padding: 0 16px 16px;
        font-size: 15px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 8px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
        transition: all 0.12s;
        border-left: 3px solid transparent;
      }
      .nav-item:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.03);
      }
      .nav-item.active {
        color: var(--text);
        background: rgba(59, 130, 246, 0.1);
        border-left-color: var(--accent);
      }
      .main {
        flex: 1;
        padding: 24px;
        max-width: calc(100vw - 210px);
        min-height: 100vh;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 16px;
      }
      .card h3,
      .card h2 {
        margin-bottom: 14px;
        font-size: 16px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 3px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 9px 11px;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
        outline: none;
        font-family: inherit;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      textarea {
        resize: vertical;
        min-height: 60px;
        font-family: monospace;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 8px 15px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        opacity: 0.85;
      }
      .btn-danger {
        background: var(--red);
        color: #fff;
      }
      .btn-danger:hover {
        opacity: 0.85;
      }
      .btn-outline {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
        border: none;
        padding: 4px 8px;
      }
      .btn-ghost:hover {
        color: var(--text);
      }
      .btn-sm {
        padding: 5px 11px;
        font-size: 12px;
      }
      .btn-xs {
        padding: 3px 7px;
        font-size: 11px;
      }
      .btn-block {
        width: 100%;
        justify-content: center;
      }
      .flex {
        display: flex;
      }
      .items-center {
        align-items: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .gap-1 {
        gap: 4px;
      }
      .gap-2 {
        gap: 8px;
      }
      .gap-3 {
        gap: 12px;
      }
      .gap-4 {
        gap: 16px;
      }
      .mb-1 {
        margin-bottom: 4px;
      }
      .mb-2 {
        margin-bottom: 8px;
      }
      .mb-3 {
        margin-bottom: 12px;
      }
      .mb-4 {
        margin-bottom: 16px;
      }
      .mt-2 {
        margin-top: 8px;
      }
      .mt-4 {
        margin-top: 16px;
      }
      .text-sm {
        font-size: 12px;
      }
      .text-xs {
        font-size: 10px;
      }
      .text-muted {
        color: var(--muted);
      }
      .font-bold {
        font-weight: 700;
      }
      .w-full {
        width: 100%;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 99px;
        font-size: 10px;
        font-weight: 600;
      }
      .badge-green {
        background: rgba(34, 197, 94, 0.15);
        color: var(--green);
      }
      .badge-red {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
      }
      .badge-yellow {
        background: rgba(234, 179, 8, 0.15);
        color: var(--yellow);
      }
      .badge-blue {
        background: rgba(59, 130, 246, 0.15);
        color: var(--accent);
      }
      .progress {
        width: 100%;
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        border-radius: 99px;
        transition: width 0.3s;
      }
      .pb-green {
        background: var(--green);
      }
      .pb-yellow {
        background: var(--yellow);
      }
      .pb-red {
        background: var(--red);
      }
      .pb-blue {
        background: var(--accent);
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        display: inline-block;
      }
      .status-online {
        background: var(--green);
      }
      .status-offline {
        background: var(--red);
      }
      .node-ping-selector {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .node-ping-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 10px;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
        max-height: 230px;
        overflow: auto;
      }
      .node-ping-row {
        display: grid;
        grid-template-columns: 22px 24px minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        padding: 8px 9px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.02);
        font-size: 12px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .node-ping-row input {
        width: auto;
      }
      .node-ping-row[data-selected="true"] {
        cursor: grab;
      }
      .node-ping-row.drag-over {
        border-top: 2px solid var(--accent);
        background: rgba(59, 130, 246, 0.12);
      }
      .node-ping-handle {
        color: var(--muted);
        text-align: center;
        user-select: none;
      }
      .node-ping-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .node-ping-empty {
        padding: 10px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      .node-ping-badge {
        display: inline-flex;
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 10px;
        white-space: nowrap;
        background: rgba(148, 163, 184, 0.12);
        color: var(--muted);
      }
      .node-ping-badge.card-slot {
        background: rgba(59, 130, 246, 0.16);
        color: #60a5fa;
      }
      .ping-table {
        table-layout: fixed;
      }
      .ping-table th,
      .ping-table td {
        vertical-align: middle;
      }
      .ping-table td {
        height: 58px;
      }
      .ping-name {
        font-weight: 700;
        line-height: 1.25;
      }
      .ping-target {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-wrap: anywhere;
        color: var(--text);
        line-height: 1.35;
      }
      .ping-type,
      .ping-interval,
      .ping-actions {
        white-space: nowrap;
      }
      .ping-actions-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 9px 11px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }
      th {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      td {
        font-size: 13px;
      }
      .empty-state {
        text-align: center;
        padding: 48px 20px;
        color: var(--muted);
      }
      .token-box {
        font-family: monospace;
        background: #0f172a;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 12px;
        word-break: break-all;
        cursor: pointer;
      }
      .token-box:hover {
        background: #1e293b;
      }
      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--green);
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 13px;
        z-index: 999;
        animation: fadeout 1.8s forwards;
      }
      @keyframes fadeout {
        0%,
        60% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 22px;
        width: min(540px, 93vw);
        max-height: 90vh;
        overflow-y: auto;
      }
      .sec-title {
        color: var(--accent);
        font-size: 13px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 6px;
        margin: 18px 0 10px;
      }
      .sec-title:first-child {
        margin-top: 0;
      }
      @media (max-width: 768px) {
        body {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          min-height: auto;
          position: sticky;
          top: 0;
          z-index: 10;
          flex-direction: row;
          overflow-x: auto;
          padding: 2px 4px;
          gap: 0;
          flex-wrap: nowrap;
          -webkit-overflow-scrolling: touch;
        }
        .sidebar h2 {
          display: none;
        }
        .nav-item {
          border-left: none;
          border-bottom: 3px solid transparent;
          white-space: nowrap;
          padding: 6px 7px;
          font-size: 10px;
          flex-shrink: 0;
        }
        .nav-item.active {
          border-left: none;
          border-bottom-color: var(--accent);
        }
        .main {
          max-width: 100%;
          padding: 8px;
        }
        .grid-2,
        .grid-3 {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .modal-grid {
          grid-template-columns: 1fr;
        }
        .modal {
          width: 96vw;
          padding: 14px;
          margin: 8px;
        }
        .card {
          padding: 12px;
          margin-bottom: 8px;
        }
        table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }
        th,
        td {
          padding: 6px 8px;
          font-size: 11px;
        }
        .btn {
          padding: 6px 10px;
          font-size: 11px;
        }
        .btn-sm {
          padding: 4px 8px;
          font-size: 10px;
        }
        .btn-xs {
          padding: 2px 6px;
          font-size: 9px;
        }
        input,
        select,
        textarea {
          padding: 8px;
          font-size: 12px;
        }
        h2 {
          font-size: 16px;
        }
        h3 {
          font-size: 14px;
        }
        .stat .val {
          font-size: 18px;
        }
        .token-box {
          font-size: 10px;
          word-break: break-all;
        }
        .flex.gap-1 {
          flex-wrap: wrap;
        }
      }
      .draggable-row {
        cursor: grab;
        transition: background 0.15s;
      }
      .draggable-row:active {
        cursor: grabbing;
      }
      .draggable-row.drag-over {
        background: rgba(59, 130, 246, 0.15);
        border-top: 2px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar"><h2>Monitor</h2></div>
    <div class="main" id="main"></div>
    <div id="modals"></div>
    <script>
      "use strict";
      var A = "/api/rpc2";
      var page = "dashboard";
      var session = null;
      var logsPage = 1;

      function $(s) {
        return document.querySelector(s);
      }
      function $$(s) {
        return document.querySelectorAll(s);
      }
      function H(s) {
        var d = document.createElement("div");
        d.innerHTML = s;
        return d.firstElementChild;
      }
      function E(s) {
        var d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }
      function B(v) {
        if (!v || v === 0) return "0 B";
        var u = ["B", "KB", "MB", "GB", "TB"];
        var i = 0;
        while (v >= 1024 && i < u.length - 1) {
          v /= 1024;
          i++;
        }
        return v.toFixed(i > 1 ? 2 : 0) + " " + u[i];
      }
      function bps(v) {
        return B(v) + "/s";
      }
      function ago(ts) {
        if (!ts) return "-";
        var ms = new Date(ts).getTime();
        if (!Number.isFinite(ms)) return "-";
        var s = Math.max(0,(Date.now()-ms)/1000);
        if (s < 5) return"刚刚";
        if (s < 60) return Math.floor(s) + "s";
        if (s < 3600) return Math.floor(s / 60) + "m";
        if (s < 86400) return Math.floor(s / 3600) + "h";
        return Math.floor(s / 86400) + "d";
      }
      async function copy(txt) {
        try {
          await navigator.clipboard.writeText(txt);
          toast("已复制");
        } catch (e) {
          var ta = document.createElement("textarea");
          ta.value = txt;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
          toast("已复制");
        }
      }

      async function RPC(method, params) {
        params = params || {};
        try {
          var r = await fetch(A, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
              jsonrpc: "2.0",
              method: method,
              params: params,
              id: Date.now(),
            }),
          });
          if (r.status === 401) {
            logout();
            return null;
          }
          var d = await r.json();
          if (d.error) throw new Error(d.error.message || "RPC error");
          return d.result;
        } catch (e) {
          console.error(method, e);
          return null;
        }
      }

      function toast(msg) {
        var t = H('<div class="toast">' + msg + "</div>");
        document.body.appendChild(t);
        setTimeout(function () {
          t.remove();
        }, 2000);
      }

      function openModal(id, title, html) {
        var ov = H(
          '<div class="modal-overlay" id="' +
            id +
            '"><div class="modal"><div class="flex justify-between items-center mb-3"><h3>' +
            title +
            '</h3><button class="btn-ghost" style="font-size:18px" onclick="document.getElementById(\'' +
            id +
            "').remove()\">×</button></div>" +
            html +
            "</div></div>",
        );
        ov.onclick = function (e) {
          if (e.target === ov) ov.remove();
        };
        document.getElementById("modals").appendChild(ov);
      }

      function closeModal(id) {
        var m = document.getElementById(id);
        if (m) m.remove();
      }

      // ====== NAV ======
      var NAV = [
        { id: "dashboard", icon: "📊", label: "总览" },

        { id: "ping", icon: "📡", label: "Ping 任务" },
        { id: "settings", icon: "⚙", label: "站点设置" },
        { id: "theme", icon: "🎨", label: "主题" },
        { id: "account", icon: "👤", label: "账户" },
        { id: "sessions", icon: "🔑", label: "会话" },
        { id: "database", icon: "🗄", label: "数据库" },
        { id: "clipboard", icon: "📎", label: "剪贴板" },
        { id: "backup", icon: "💾", label: "备份" },
        { id: "home", icon: "🏠", label: "前台首页", external: true },
        { id: "logout", icon: "🚪", label: "退出", action: "logout" },
      ];

      function buildSidebar() {
        var s = document.getElementById("sidebar");
        NAV.forEach(function (n) {
          var el = H(
            '<div class="nav-item" data-page="' +
              n.id +
              '"><span style="width:18px;text-align:center">' +
              n.icon +
              "</span>" +
              n.label +
              "</div>",
          );
          if (n.external) {
            el.onclick = function () {
              window.open("/", "_blank");
            };
          } else if (n.action === "logout") {
            el.onclick = function () {
              logout();
            };
          } else {
            el.onclick = function () {
              navigate(n.id);
            };
          }
          s.appendChild(el);
        });
      }

      function navigate(p) {
        page = p;
        var items = document.querySelectorAll(".nav-item");
        for (var i = 0; i < items.length; i++)
          items[i].classList.toggle("active", items[i].dataset.page === p);
        render();
      }

      // ====== AUTH ======
      async function checkSession() {
        var me = await RPC("public:getMe");
        session = me && me.logged_in ? me : null;
        if (!session) {
          document.getElementById("sidebar").style.display = "none";
          document.getElementById("main").innerHTML =
            '<div class="card empty-state" style="max-width:400px;margin:80px auto"><h2 style="margin-bottom:20px;text-align:center">Monitor Admin</h2><form id="loginForm"><input name="user" placeholder="用户名" class="mb-3" autofocus required><input name="pass" type="password" placeholder="密码" class="mb-3" required><button class="btn btn-primary w-full" id="loginBtn">登录</button><div id="loginErr" style="color:var(--red);margin-top:10px;font-size:12px"></div></form></div>';
          document.getElementById("loginForm").onsubmit = async function (e) {
            e.preventDefault();
            var f = new FormData(e.target);
            var btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.textContent = "...";
            try {
              var r = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                  username: f.get("user"),
                  password: f.get("pass"),
                }),
              });
              if (!r.ok) throw new Error("用户名或密码错误");
              location.reload();
            } catch (err) {
              document.getElementById("loginErr").textContent = err.message;
            } finally {
              btn.disabled = false;
              btn.textContent = "登录";
            }
          };
        }
      }

      async function logout() {
        await fetch("/api/logout", { credentials: "include" });
        session = null;
        location.reload();
      }

      // ====== RENDER ======
      function loading() {
        return '<div style="text-align:center;padding:40px;color:var(--muted)">加载中...</div>';
      }

      async function render() {
        var m = document.getElementById("main");
        m.innerHTML = loading();
        try {
          switch (page) {
            case "dashboard":
              m.innerHTML = await dashPage();
              break;
            case "nodes":
              m.innerHTML = await dashPage();
              break;
            case "logs":
              m.innerHTML = await logsPage();
              break;
            case "ping":
              m.innerHTML = await pingPage();
              break;
            case "settings":
              m.innerHTML = await settingsPage();
              break;
            case "theme":
              m.innerHTML = await themePage();
              break;
            case "account":
              m.innerHTML = await accountPage();
              break;
            case "sessions":
              m.innerHTML = await sessionsPage();
              break;
            case "database":
              m.innerHTML = await databasePage();
              break;
            case "clipboard":
              m.innerHTML = await clipboardPage();
              break;
            case "backup":
              m.innerHTML = await backupPage();
              break;
          }
        } catch (e) {
          m.innerHTML =
            '<div class="card empty-state">错误: ' + E(e.message) + "</div>";
        }
        bindEvents();
      }

      // ====== PAGES ======
      async function dashPage() {
        var nodes = (await RPC("admin:listClients")) || [];
        var status = (await RPC("common:getNodesLatestStatus")) || {};
        var liveData = status.data || status || {};
        for (var i = 0; i < nodes.length; i++) {
          var s = liveData[nodes[i].uuid];
          if (s) {
            nodes[i].online = s.online;
            nodes[i].cpu = s.cpu;
            nodes[i].ram = s.ram;
            nodes[i].disk = s.disk;
            nodes[i].net_out = s.network_up;
            nodes[i].net_in = s.network_down;

            return;
          }

          function shellQuote(value) {
            return "'" + String(value).replace(/'/g, "'\"'\"'") + "'";
          }
          function systemdQuote(value) {
            return (
              '"' +
              String(value)
                .replace(/%/g, "%%")
                .replace(/([\\"])/g, "\\$1") +
              '"'
            );
          }
          function utf8Base64(value) {
            var bytes = new TextEncoder().encode(value),
              binary = "";
            for (var i = 0; i < bytes.length; i++)
              binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
          }

          endpoint = String(endpoint || location.origin).replace(/\/+$/, "");
          var args = [
            "-e",
            endpoint,
            "-t",
            token,
            "-i",
            String(intervalNumber),
          ];
          if (dns) args.push("--custom-dns", dns);
          if (inNic) args.push("--include-nics", inNic);
          if (exNic) args.push("--exclude-nics", exNic);
          if (mps) args.push("--include-mountpoint", mps);

          var execStart = [path].concat(args).map(systemdQuote).join(" ");
          var unit =
            "[Unit]\nDescription=Monitor Agent\nWants=network-online.target\nAfter=network-online.target\n\n[Service]\nType=simple\nExecStart=" +
            execStart +
            "\nRestart=always\nRestartSec=10\n\n[Install]\nWantedBy=multi-user.target\n";
          var release =
            "https://github.com/QiuXiaoye1112/monitor-agent/releases/download/v1.0.0/monitor-agent-linux-amd64";
          var newPath = path + ".new";
          var cmd =
            'set -e; [ "$(id -u)" -eq 0 ] || { echo "请使用 root 运行"; exit 1; }; [ "$(uname -m)" = "x86_64" ] || { echo "目前仅支持 AMD64"; exit 1; }; TMP=$(mktemp /tmp/monitor-agent-install.XXXXXX); trap \'rm -f "$TMP"\' EXIT; curl -fsSL ' +
            shellQuote(release) +
            ' -o "$TMP"; install -d -m 0755 "$(dirname -- ' +
            shellQuote(path) +
            ')"; install -m 0755 "$TMP" ' +
            shellQuote(newPath) +
            "; mv -f " +
            shellQuote(newPath) +
            " " +
            shellQuote(path) +
            "; printf %s " +
            shellQuote(utf8Base64(unit)) +
            " | base64 -d > /etc/systemd/system/monitor-agent.service; systemctl daemon-reload; systemctl enable monitor-agent >/dev/null; systemctl restart monitor-agent; systemctl is-active monitor-agent";
          var el = document.getElementById("cmd" + id);
          el.textContent = cmd;
          el.onclick = function () {
            copy(this.textContent);
          };
          document.getElementById("cmdArea" + id).style.display = "block";
        };
      }

      function renderNodePingSelector(tasks, selectedOrder) {
        tasks = tasks || [];
        selectedOrder = (selectedOrder || []).map(function (id) {
          return String(id);
        });
        var selectedSet = {};
        selectedOrder.forEach(function (id) {
          selectedSet[id] = true;
        });
        var byId = {};
        tasks.forEach(function (task) {
          byId[String(task.id)] = task;
        });
        var selected = [];
        selectedOrder.forEach(function (id) {
          if (byId[id]) selected.push(byId[id]);
        });
        tasks.forEach(function (task) {
          if (!selectedSet[String(task.id)]) return;
          var exists = selected.some(function (item) {
            return String(item.id) === String(task.id);
          });
          if (!exists) selected.push(task);
        });
        var unselected = tasks.filter(function (task) {
          return !selectedSet[String(task.id)];
        });
        function row(task, isSelected) {
          return (
            '<label class="node-ping-row" data-task-id="' +
            task.id +
            '" data-selected="' +
            (isSelected ? "true" : "false") +
            '" draggable="' +
            (isSelected ? "true" : "false") +
            '">' +
            '<span class="node-ping-handle">' +
            (isSelected ? "☰" : "") +
            "</span>" +
            '<input type="checkbox" ' +
            (isSelected ? "checked" : "") +
            ">" +
            '<span class="node-ping-name" title="' +
            E(task.name || "") +
            '">' +
            E(task.name || "任务 " + task.id) +
            "</span>" +
            '<span class="node-ping-badge"></span></label>'
          );
        }
        var html =
          '<h4 class="sec-title">Ping 任务</h4><div class="node-ping-selector">' +
          '<div><div class="flex justify-between items-center mb-2"><span class="text-xs text-muted">已选择（拖动排序）</span><span class="text-xs text-muted">前三项显示在卡片</span></div>' +
          '<div class="node-ping-list node-ping-selected">';
        if (selected.length) {
          selected.forEach(function (task) {
            html += row(task, true);
          });
        } else html += '<div class="node-ping-empty">尚未选择任务</div>';
        html +=
          '</div></div><div><div class="text-xs text-muted mb-2">未选择</div><div class="node-ping-list node-ping-unselected">';
        if (unselected.length) {
          unselected.forEach(function (task) {
            html += row(task, false);
          });
        } else html += '<div class="node-ping-empty">没有其他任务</div>';
        html += "</div></div></div>";
        return html;
      }
      function bindNodePingSelector(form) {
        if (!form) return;
        var selected = form.querySelector(".node-ping-selected");
        var unselected = form.querySelector(".node-ping-unselected");
        if (!selected || !unselected) return;
        var dragSrc = null;
        function ensureEmpty(container, text) {
          var rows = container.querySelectorAll(".node-ping-row");
          var empty = container.querySelector(".node-ping-empty");
          if (rows.length && empty) empty.remove();
          if (!rows.length && !empty) {
            var e = document.createElement("div");
            e.className = "node-ping-empty";
            e.textContent = text;
            container.appendChild(e);
          }
        }
        function refresh() {
          var slot = 0;
          Array.from(selected.querySelectorAll(".node-ping-row")).forEach(
            function (row) {
              row.dataset.selected = "true";
              row.draggable = true;
              row.querySelector(".node-ping-handle").textContent = "☰";
              var badge = row.querySelector(".node-ping-badge");
              badge.className = "node-ping-badge";
              slot++;
              if (slot <= 3) {
                badge.textContent = "卡片 " + slot;
                badge.classList.add("card-slot");
              } else badge.textContent = "仅详情";
            },
          );
          Array.from(unselected.querySelectorAll(".node-ping-row")).forEach(
            function (row) {
              row.dataset.selected = "false";
              row.draggable = false;
              row.querySelector(".node-ping-handle").textContent = "";
              var badge = row.querySelector(".node-ping-badge");
              badge.className = "node-ping-badge";
              badge.textContent = "未选择";
            },
          );
          ensureEmpty(selected, "尚未选择任务");
          ensureEmpty(unselected, "没有其他任务");
        }
        form.addEventListener("change", function (event) {
          var checkbox = event.target.closest(
            '.node-ping-row input[type="checkbox"]',
          );
          if (!checkbox) return;
          var row = checkbox.closest(".node-ping-row");
          (checkbox.checked ? selected : unselected).appendChild(row);
          refresh();
        });
        form.addEventListener("dragstart", function (event) {
          var row = event.target.closest(".node-ping-row");
          if (!row || row.dataset.selected !== "true") return;
          dragSrc = row;
          event.dataTransfer.effectAllowed = "move";
          row.style.opacity = ".45";
        });
        form.addEventListener("dragend", function () {
          if (dragSrc) dragSrc.style.opacity = "1";
          dragSrc = null;
          form.querySelectorAll(".node-ping-row").forEach(function (row) {
            row.classList.remove("drag-over");
          });
        });
        selected.addEventListener("dragover", function (event) {
          var row = event.target.closest(".node-ping-row");
          if (!dragSrc || !row || row === dragSrc) return;
          event.preventDefault();
          row.classList.add("drag-over");
        });
        selected.addEventListener("dragleave", function (event) {
          var row = event.target.closest(".node-ping-row");
          if (row) row.classList.remove("drag-over");
        });
        selected.addEventListener("drop", function (event) {
          event.preventDefault();
          var row = event.target.closest(".node-ping-row");
          if (!dragSrc) return;
          if (row && row !== dragSrc) {
            var rows = Array.from(selected.querySelectorAll(".node-ping-row"));
            selected.insertBefore(
              dragSrc,
              rows.indexOf(dragSrc) < rows.indexOf(row) ? row.nextSibling : row,
            );
          } else selected.appendChild(dragSrc);
          refresh();
        });
        refresh();
      }
      function collectNodePingOrder(form) {
        return Array.from(
          form.querySelectorAll(".node-ping-selected .node-ping-row"),
        )
          .map(function (row) {
            return parseInt(row.dataset.taskId);
          })
          .filter(function (id) {
            return Number.isInteger(id) && id > 0;
          });
      }

              '<form id="anf' +
                id +
                '"><div class="modal-grid"><div class="form-group"><label>\u540d\u79f0</label><input name="name" required placeholder="VPS-1"></div><div class="form-group"><label>\u5206\u7ec4</label><input name="group" placeholder="\u4f8b\u5982: \u65e5\u672c\u8282\u70b9"></div></div><div class="modal-grid"><div class="form-group"><label>\u6743\u91cd</label><input name="weight" type="number" value="0"></div><div class="form-group"><label>\u9690\u85cf</label><select name="hidden"><option value="false" selected>\u5426</option><option value="true">\u662f</option></select></div></div><h4 class="sec-title">\u6d41\u91cf</h4><div class="modal-grid"><div class="form-group"><label>\u542f\u7528\u6708\u5ea6\u6d41\u91cf\u91cd\u7f6e</label><select name="traffic_reset_enabled"><option value="true" selected>\u5f00\u542f</option><option value="false">\u5173\u95ed</option></select></div><div class="form-group"><label>\u6d41\u91cf\u9608\u503c (GB)</label><input name="traffic_limit" type="number" value="0"></div></div><div class="modal-grid"><div class="form-group"><label>\u9608\u503c\u7c7b\u578b</label><select name="traffic_limit_type"><option value="sum" selected>\u5408\u8ba1</option><option value="up">\u4e0a\u884c</option><option value="down">\u4e0b\u884c</option></select></div><div class="form-group"><label>\u6d41\u91cf\u8865\u507f (GB)</label><input name="traffic_compensation" type="number" step="0.01" value="0.00"></div></div><div class="modal-grid"><div class="form-group"><label>\u91cd\u7f6e\u65e5(1-31)</label><input name="traffic_reset_day" type="number" min="1" max="31" value="1"></div><div class="form-group"><label>\u91cd\u7f6e\u5c0f\u65f6(0-23)</label><input name="traffic_reset_hour" type="number" min="0" max="23" value="0"></div></div><div class="text-xs text-muted mt-1">\u6d41\u91cf\u8865\u507f\u652f\u6301\u8d1f\u6570\uff0c\u6bcf\u6708\u91cd\u7f6e\u65e5\u81ea\u52a8\u6e05\u96f6\u3002</div><button class="btn btn-primary w-full mt-3" type="submit">\u521b\u5efa</button></form>',
            );
            var addForm = _d.getElementById("anf" + id);
            addForm
              .querySelector('button[type="submit"]')
              .insertAdjacentHTML(
                "beforebegin",
                renderNodePingSelector(pingTasks, []),
              );
            bindNodePingSelector(addForm);
            addForm.onsubmit = async function (e) {
              e.preventDefault();
              var f = new FormData(e.target);
              var compGB = parseFloat(f.get("traffic_compensation")) || 0;
              var data = {
                name: f.get("name"),
                group: f.get("group"),
                weight: parseInt(f.get("weight")) || 0,
                hidden: f.get("hidden") === "true",
                traffic_limit:
                  (parseInt(f.get("traffic_limit")) || 0) * 1073741824,
                traffic_limit_type: f.get("traffic_limit_type"),
                traffic_reset_day: parseInt(f.get("traffic_reset_day")) || 1,
                traffic_reset_hour: parseInt(f.get("traffic_reset_hour")) || 0,
                traffic_compensation: Math.round(compGB * 1073741824),
                traffic_reset_enabled:
                  f.get("traffic_reset_enabled") === "true",
                ping_task_order: collectNodePingOrder(e.target),
              };
              var r = await RPC("admin:addClient", data);
              closeModal(id);
              if (r && r.token) {
                var id2 = uid();
                openModal(
                  id2,
                  "\u5df2\u521b\u5efa",
                  '<div class="token-box mb-3" id="ntk' +
                    id2 +
                    '">' +
                    E(r.token) +
                    '</div><p class="text-xs text-muted mb-1">UUID: ' +
                    E(r.uuid || "") +
                    '</p><p class="text-xs text-muted">\u70b9\u51fb Token \u590d\u5236</p><button class="btn btn-primary btn-sm w-full" onclick="closeModal(\'' +
                    id2 +
                    "')\">\u5b8c\u6210</button>",
                );
                _d.getElementById("ntk" + id2).onclick = function () {
                  copy(this.textContent);
                };
              }
              navigate("dashboard");
            };
          };
        var pbtn = _d.getElementById("addPingBtn");
        if (pbtn)
          pbtn.onclick = async function () {
            var id = uid();
            openModal(
              id,
              "添加 Ping 任务",
              '<form id="apf' +
                id +
                '"><div class="form-group"><label>名称</label><input name="name" required></div>' +
                '<div class="modal-grid"><div class="form-group"><label>目标 IP/域名</label><input name="target" required></div><div class="form-group"><label>类型</label><select name="type"><option value="icmp">ICMP</option><option value="tcp">TCP</option><option value="http">HTTP</option></select></div></div>' +
                '<div class="form-group"><label>间隔(秒)</label><input name="interval" type="number" value="60" required></div>' +
                '<p class="text-xs text-muted mb-2">创建后请在节点列表的“编辑节点”中选择作用节点并排序。</p>' +
                '<button class="btn btn-primary w-full mt-2" type="submit">创建</button></form>',
            );
            _d.getElementById("apf" + id).onsubmit = async function (e) {
              e.preventDefault();
              var f = new FormData(e.target);
              await RPC("admin:addPingTask", {
                name: f.get("name"),
                target: f.get("target"),
                type: f.get("type"),
                interval: parseInt(f.get("interval")),
                clients: [],
                default_on: false,
              });
              closeModal(id);
              toast("已创建");
              navigate("ping");
            };
          };

        var rbtn = _d.getElementById("reorderNodesBtn");
        if (rbtn) rbtn.onclick = reorderNodes;

        var sf = _d.getElementById("settingsForm");
        if (sf)
          sf.onsubmit = async function (e) {
            e.preventDefault();
            var f = new FormData(e.target);
            var cfg = {};
            for (var pair of f.entries()) {
              var v = pair[1];
              if (v === "true") cfg[pair[0]] = true;
              else if (v === "false") cfg[pair[0]] = false;
              else if (!isNaN(Number(v)) && v !== "") cfg[pair[0]] = Number(v);
              else cfg[pair[0]] = v;
            }
            await RPC("admin:editSettings", cfg);
            toast("设置已保存");
          };

        var tf = _d.getElementById("themeForm");
        if (tf)
          tf.onsubmit = async function (e) {
            e.preventDefault();
            var f = new FormData(e.target);
            var cfg = {};
            for (var pair of f.entries()) {
              var v = pair[1];
              if (v === "true") cfg[pair[0]] = true;
              else if (v === "false") cfg[pair[0]] = false;
              else if (!isNaN(Number(v)) && v !== "") cfg[pair[0]] = Number(v);
              else cfg[pair[0]] = v;
            }
            await fetch("/api/admin/theme/settings?theme=VPS", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify(cfg),
            });
            toast("主题已保存");
          };

        var ai = _d.getElementById("avatarInput");
        if (ai)
          ai.onchange = async function () {
            var f = ai.files[0];
            if (!f || !f.type.startsWith("image/")) return;
            var c = document.createElement("canvas");
            c.width = c.height = 512;
            var ctx = c.getContext("2d");
            var img = new Image();
            img.onload = function () {
              var s = Math.min(512 / img.width, 512 / img.height);
              var w = Math.round(img.width * s);
              var h = Math.round(img.height * s);
              ctx.clearRect(0, 0, 512, 512);
              ctx.drawImage(
                img,
                Math.round((512 - w) / 2),
                Math.round((512 - h) / 2),
                w,
                h,
              );
              c.toBlob(async function (b) {
                var fd = new FormData();
                fd.append("image", b, "avatar.png");
                var r = await fetch("/api/avatar", {
                  method: "POST",
                  credentials: "include",
                  body: fd,
                });
                if (r.ok) {
                  toast("头像已更新");
                  var ap = _d.getElementById("avatarPreview");
                  if (ap) ap.src = c.toDataURL();
                } else toast("上传失败");
              }, "image/png");
            };
            img.src = URL.createObjectURL(f);
          };
        var uf = _d.getElementById("changeUserForm");
        if (uf)
          uf.onsubmit = async function (e) {
            e.preventDefault();
            var me = await RPC("public:getMe");
            await fetch("/api/admin/update/user", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({
                uuid: me.uuid,
                username: e.target.username.value,
              }),
            });
            toast("用户名已更新");
          };

        var pf = _d.getElementById("changePassForm");
        if (pf)
          pf.onsubmit = async function (e) {
            e.preventDefault();
            if (e.target.password.value !== e.target.password_repeat.value) {
              toast("两次密码不一致");
              return;
            }
            var me2 = await RPC("public:getMe");
            await fetch("/api/admin/update/user", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({
                uuid: me2.uuid,
                password: e.target.password.value,
              }),
            });
            toast("密码已更新");
            e.target.reset();
          };

        var dob = _d.getElementById("delOtherSessions");
        if (dob)
          dob.onclick = async function () {
            var s = (await RPC("admin:getSessions")) || {
              sessions: [],
              current: "",
            };
            var list = s.sessions || s.data || [];
            for (var i = 0; i < list.length; i++) {
              if (list[i].session !== s.current)
                await RPC("admin:deleteSession", { session: list[i].session });
            }
            toast("已清除其他会话");
            navigate("sessions");
          };

        var dab = _d.getElementById("delAllSessions");
        if (dab)
          dab.onclick = async function () {
            await RPC("admin:deleteAllSessions");
            toast("全部会话已清除，请重新登录");
            setTimeout(logout, 1500);
          };

        var vb = _d.getElementById("vacuumBtn");
        if (vb)
          vb.onclick = async function () {
            var r = await RPC("admin:vacuumDatabase");
            if (r)
              toast(
                "压缩完成: " +
                  B(r.before || 0) +
                  " → " +
                  B(r.after || r.size || 0),
              );
            else toast("已压缩");
          };

        var cpb = _d.getElementById("clearPingBtn");
        if (cpb)
          cpb.onclick = async function () {
            var mid = uid();
            var htm =
              '<p class=\"mb-3\">确定要清空所有Ping记录吗？此操作不可撤销。</p><div class=\"flex gap-2\"><button class=\"btn btn-outline btn-sm\" style=\"flex:1\" onclick=\"closeModal(\\x27' +
              mid +
              '\\x27)\">取消</button><button class=\"btn btn-danger btn-sm\" style=\"flex:1\" id=\"btn' +
              mid +
              '\">确认清空</button></div>';
            openModal(mid, "清空Ping记录", htm);
            document.getElementById("btn" + mid).onclick = async function () {
              await RPC("admin:clearPingRecords");
              closeModal(mid);
              toast("Ping记录已清空");
            };
          };
        var crb = _d.getElementById("clearRecordsBtn");
        if (crb)
          crb.onclick = async function () {
            await RPC("admin:clearRecords");
            toast("监控记录已清空");
          };

        var cab = _d.getElementById("clearAllRecordsBtn");
        if (cab)
          cab.onclick = async function () {
            var mid = uid();
            openModal(
              mid,
              "清空全部记录",
              '<p class="mb-3">确定清空所有记录？此操作不可恢复。</p><div class="flex gap-2"><button class="btn btn-outline btn-sm" style="flex:1" onclick="closeModal(\'' +
                mid +
                '\')">取消</button><button class="btn btn-danger btn-sm" style="flex:1" id="clearAll' +
                mid +
                '">确认清空</button></div>',
            );
            document.getElementById("clearAll" + mid).onclick =
              async function () {
                await RPC("admin:clearAllRecords");
                closeModal(mid);
                toast("全部记录已清空");
              };
          };

        var acb = _d.getElementById("addClipBtn");
        if (acb)
          acb.onclick = async function () {
            var id = uid();
            openModal(
              id,
              "新建",
              '<form id="ncf' +
                id +
                '"><div class="form-group"><label>标题</label><input name="name" required></div><div class="form-group"><label>内容</label><textarea name="text" rows="6" required></textarea></div><button class="btn btn-primary w-full mt-2" type="submit">创建</button></form>',
            );
            _d.getElementById("ncf" + id).onsubmit = async function (e) {
              e.preventDefault();
              var f = new FormData(e.target);
              await RPC("admin:createClipboard", {
                name: f.get("name"),
                text: f.get("text"),
              });
              closeModal(id);
              toast("已创建");
              navigate("clipboard");
            };
          };

        var bf = _d.getElementById("backupForm");
        if (bf)
          bf.onsubmit = async function (e) {
            e.preventDefault();
            var fd = new FormData(e.target);
            var r = await fetch("/api/admin/upload/backup", {
              method: "POST",
              credentials: "include",
              body: fd,
            });
            if (r.ok) toast("备份已上传恢复");
            else toast("上传失败");
          };

        // Clipboard copy buttons
        var copyBtns = _d.querySelectorAll("[id^='clipCopy']");
        for (var i = 0; i < copyBtns.length; i++) {
          (function (btn) {
            var cid = parseInt(btn.id.replace("clipCopy", ""));
            btn.onclick = async function () {
              var items = await RPC("admin:listClipboard");
              var c = (items || []).find(function (x) {
                return x.id === cid;
              });
              if (c) copy(c.text || c.content || "");
            };
          })(copyBtns[i]);
        }
      }

      async function init() {
        buildSidebar();
        await checkSession();
        if (session) {
          navigate("dashboard");
        }
      }
      init();
    </script>
  </body>
</html>
